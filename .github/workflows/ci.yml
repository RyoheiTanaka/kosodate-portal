name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Dependabot の PR は lockfile が壊れた状態で来るため（issue #91）、
    # 先に修復してから同じ検証を回す dependabot-lockfile.yml が担当する。
    # ここでも走らせると必ず npm ci で落ちて、二重に赤くなって判断を誤らせる。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm install ではなく npm ci を使う。
      # lockfile と package.json のズレを検知するため（issue #91 はこれが無くて半年埋もれた）。
      - name: 依存をインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: ビルド
        run: npm run build

      # ビルドが通っても実行時に壊れていることがある。
      # 中身は scripts/ci-smoke.sh。dependabot-lockfile.yml と共用している。
      - name: スモークテスト
        run: bash scripts/ci-smoke.sh
